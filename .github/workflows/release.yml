name: Build Formaku image
run-name: Formaku ${{ inputs.release_id || github.ref_name }}
on:
  push:
    tags: ['v*-alpha*']
  workflow_dispatch:
    inputs:
      release_id:
        required: true
        type: string
      source_commit:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: formaku-build-${{ inputs.release_id || github.ref_name }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.created
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write
    outputs:
      source: ${{ steps.source.outputs.sha }}
      ci_url: ${{ steps.source.outputs.ci_url }}
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate source
        id: source
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha(\.[0-9]+)?$ ]]; then
              echo "::error::Expected an alpha release tag"
              exit 1
            fi
            SOURCE_COMMIT=$(git rev-parse 'HEAD^{commit}')
          fi
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$SOURCE_COMMIT" refs/remotes/origin/main
          git show HEAD:scripts/verify-release-image.sh > "$RUNNER_TEMP/formaku-verify-release-image.sh"
          git checkout --detach "$SOURCE_COMMIT"
          image_version=$SOURCE_COMMIT
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            image_version=${GITHUB_REF_NAME#v}
          fi
          {
            echo "sha=$SOURCE_COMMIT"
            echo "version=$image_version"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            ci_url=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -X GET -f branch=main -f event=push -f head_sha="$SOURCE_COMMIT" \
              | jq -r --arg sha "$SOURCE_COMMIT" '
                .workflow_runs[0]
                | select(.head_sha == $sha and .head_branch == "main" and .event == "push")
                | select(.status == "completed" and .conclusion == "success")
                | .html_url')
            if [[ -z "$ci_url" ]]; then
              echo "::error::Wait for successful CI on main for $SOURCE_COMMIT, then rerun this workflow"
              exit 1
            fi
            echo "ci_url=$ci_url" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        env:
          # The Summary step records the published digest.
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.source.outputs.sha }}
          labels: |
            org.opencontainers.image.created=${{ steps.source.outputs.created }}
            org.opencontainers.image.description=Open-source Laravel CMS and schema-driven application builder
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=Formaku
            org.opencontainers.image.url=https://formaku.eu/
            org.opencontainers.image.vendor=Strefa Badań
            org.opencontainers.image.version=${{ steps.source.outputs.version }}
          sbom: true
          provenance: mode=max
      - name: Verify published runtime metadata
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_COMMIT: ${{ steps.source.outputs.sha }}
          IMAGE_VERSION: ${{ steps.source.outputs.version }}
        run: |
          bash "$RUNNER_TEMP/formaku-verify-release-image.sh" "$IMAGE" "$DIGEST" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$SOURCE_COMMIT" "$IMAGE_VERSION"
      - name: Check installation in the published image
        if: github.event_name == 'push'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: bash scripts/smoke-release-image.sh "$IMAGE@$DIGEST"
      - name: Summary
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "Image $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
  composer:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.build.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Build Composer package
        run: bash scripts/build-composer-package.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/formaku-composer"
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, zip
      - name: Install the release Composer archive in Laravel
        run: bash scripts/smoke-composer-package.sh --check-missing-chunk --check-missing-table "$RUNNER_TEMP/formaku-composer/formaku-cms-$GITHUB_REF_NAME.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: formaku-composer
          path: ${{ runner.temp }}/formaku-composer/
          compression-level: 0
          if-no-files-found: error
          overwrite: true
  publish:
    if: github.event_name == 'push'
    needs: [build, composer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.build.outputs.source }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: formaku-composer
          path: ${{ runner.temp }}/formaku-composer
      - name: Verify public image
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          repository=${IMAGE#ghcr.io/}
          token=$(curl -fsS --retry 3 --get https://ghcr.io/token \
            --data-urlencode service=ghcr.io --data-urlencode "scope=repository:$repository:pull" \
            | jq -er '.token')
          manifest=$(mktemp)
          curl -fsS --retry 3 -o "$manifest" \
            -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://ghcr.io/v2/$repository/manifests/$DIGEST"
          printf '%s  %s\n' "${DIGEST#sha256:}" "$manifest" | sha256sum --check
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ needs.build.outputs.source }}
          CI_URL: ${{ needs.build.outputs.ci_url }}
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          tag=$GITHUB_REF_NAME
          remote_tag=$(git ls-remote --exit-code origin "refs/tags/$tag" "refs/tags/$tag^{}")
          [[ "$(awk 'END {print $1}' <<< "$remote_tag")" == "$SOURCE_COMMIT" ]]

          package_dir=$RUNNER_TEMP/formaku-composer
          archive=formaku-cms-$tag.zip
          (cd "$package_dir" && sha256sum --check --strict "$archive.sha256")
          archive_digest=$(sha256sum "$package_dir/$archive" | cut -d ' ' -f 1)

          notes=$(mktemp)
          awk -v prefix="## ${tag#v} — " '
            index($0, prefix) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print; if (NF) content = 1 }
            END { if (!content) exit 1 }
          ' CHANGELOG.md > "$notes"
          {
            printf '\n**Public Linux AMD64 image**\n\n```sh\ndocker pull %s@%s\n```\n' "$IMAGE" "$DIGEST"
            printf '\n**Composer package**\n\nDownload `%s` and its SHA-256 checksum from Assets. SHA-256: `%s`. See the [Laravel installation guide](%s/%s/blob/%s/docs/developer/README.md#install-in-an-existing-laravel-app).\n' \
              "$archive" "$archive_digest" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$tag"
            printf '\n[CI](%s) · [Image build](%s/%s/actions/runs/%s)\n' \
              "$CI_URL" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf '\n[Documentation (English)](https://formaku.eu/docs/) · [Dokumentacja (polski)](https://formaku.eu/pl/docs/)\n'
          } >> "$notes"

          if ! existing=$(gh release view "$tag" --json isDraft,isPrerelease,body,assets,url); then
            gh release create "$tag" --verify-tag --draft --prerelease --latest=false \
              --title "Formaku $tag" --notes-file "$notes"
            existing=$(gh release view "$tag" --json isDraft,isPrerelease,body,assets,url)
          fi
          jq -e --arg ref "$IMAGE@$DIGEST" --arg checksum "$archive_digest" '
            .isPrerelease and (.body | contains($ref) and contains($checksum))
          ' <<< "$existing" > /dev/null

          is_draft=$(jq -r '.isDraft' <<< "$existing")
          verify_dir=$(mktemp -d)
          for asset in "$archive" "$archive.sha256"; do
            if ! jq -e --arg name "$asset" 'any(.assets[]; .name == $name)' <<< "$existing" > /dev/null; then
              [[ "$is_draft" == true ]]
              gh release upload "$tag" "$package_dir/$asset"
            fi
            gh release download "$tag" --pattern "$asset" --dir "$verify_dir"
            cmp "$package_dir/$asset" "$verify_dir/$asset"
          done
          if [[ "$is_draft" == true ]]; then
            gh release edit "$tag" --draft=false --prerelease --latest=false
          else
            jq -r '.url' <<< "$existing"
          fi
