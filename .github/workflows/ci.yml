name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      published_digest:
        description: 'Public Formaku image digest (sha256: followed by 64 lowercase hex digits)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  php:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.4', '8.5']
        database: [pgsql, mysql]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: formaku_test
          POSTGRES_USER: formaku
          POSTGRES_PASSWORD: testing
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U formaku" --health-interval 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: formaku_test
          MYSQL_USER: formaku
          MYSQL_PASSWORD: testing
          MYSQL_ROOT_PASSWORD: testing-root
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -h localhost" --health-interval 5s --health-retries 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, pdo_mysql, gd, exif, zip
      - run: composer install --no-interaction --prefer-dist
        working-directory: apps/starter
      - run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
        working-directory: apps/starter
      - run: php artisan test
        working-directory: apps/starter
        env:
          DB_CONNECTION: ${{ matrix.database }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.database == 'pgsql' && '5432' || '3306' }}
          DB_DATABASE: formaku_test
          DB_USERNAME: formaku
          DB_PASSWORD: testing
  frontend:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: bash tests/css-sources.sh
      - run: node --test tests/assistant-adapter.test.mjs
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, zip
      - name: Install a test Composer archive in Laravel
        run: |
          tag=v0.0.0-alpha.0
          archive_dir="$RUNNER_TEMP/formaku-composer"
          bash scripts/build-composer-package.sh "$tag" "$archive_dir"
          bash scripts/smoke-composer-package.sh "$archive_dir/formaku-cms-$tag.zip"

  browser:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: /tmp/formaku-e2e.sqlite
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: gd, exif
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: composer install --no-interaction --prefer-dist
        working-directory: apps/starter
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: |
          cp apps/starter/.env.example apps/starter/.env
          php apps/starter/artisan key:generate
          touch /tmp/formaku-e2e.sqlite
          php apps/starter/artisan migrate --force
          php apps/starter/artisan formaku:install
          php scripts/e2e-fixtures.php
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test --reporter=line,github

  deploy-controller:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: bash tests/deployctl.sh
      - run: bash tests/deploy-via-ssh.sh

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: formaku-ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configure the test stack
        run: |
          sed -e "s|^APP_KEY=$|APP_KEY=base64:$(openssl rand -base64 32)|" \
              -e "s|^DB_PASSWORD=$|DB_PASSWORD=$(openssl rand -hex 24)|" \
              .env.docker.example > .env.docker
      - name: Build the local image
        if: github.event_name != 'workflow_dispatch'
        run: docker compose --env-file .env.docker build web
      - name: Pull the published image
        if: github.event_name == 'workflow_dispatch'
        env:
          PUBLISHED_DIGEST: ${{ inputs.published_digest }}
        run: |
          if [[ ! "$PUBLISHED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo 'Expected sha256: followed by 64 lowercase hex digits.' >&2
            exit 1
          fi
          image="ghcr.io/formaku/formaku@${PUBLISHED_DIGEST}"
          docker pull --platform linux/amd64 "$image"
          printf 'FORMAKU_IMAGE=%s\n' "$image" >> "$GITHUB_ENV"
      - name: Smoke test the published image
        if: github.event_name == 'workflow_dispatch'
        run: bash scripts/smoke-release-image.sh "$FORMAKU_IMAGE"
      - name: Migrate and start the stack
        run: |
          docker compose --env-file .env.docker up -d --no-build --wait --wait-timeout 90 database
          docker compose --env-file .env.docker -f compose.yaml -f - run --rm --pull never -T web php artisan migrate --force <<'YAML'
          services:
            web:
              build: !reset null
          YAML
          docker compose --env-file .env.docker up -d --no-build --wait --wait-timeout 90
      - name: Check the Formaku installation
        run: docker compose --env-file .env.docker exec -T web php artisan formaku:doctor
      - name: Verify the HTTP endpoints
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/up
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8080/login
      - name: Verify PostgreSQL revision index upgrade and rollback
        if: github.event_name != 'workflow_dispatch'
        run: bash tests/revision-index-upgrade.sh
      - name: Show service logs on failure
        if: failure()
        run: docker compose --env-file .env.docker logs --no-color --tail 50
      - name: Remove the test stack
        if: always()
        run: |
          if [ -f .env.docker ]; then
            docker compose --env-file .env.docker down --volumes
          fi
