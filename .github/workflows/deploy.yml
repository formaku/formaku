name: Deploy existing image
on:
  workflow_dispatch:
    inputs:
      image:
        description: Full ghcr.io image with sha256 digest
        required: true
        type: string
      release_id:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: formaku-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Deploy through host controller
        env:
          IMAGE: ${{ inputs.image }}
          RELEASE_ID: ${{ inputs.release_id }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ vars.DEPLOY_HOST }}
          USER: ${{ vars.DEPLOY_USER }}
        run: bash scripts/deploy-via-ssh.sh
