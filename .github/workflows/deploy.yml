name: Deploy existing image
run-name: Formaku deploy ${{ inputs.release_id }}
on:
  workflow_dispatch:
    inputs:
      image:
        description: Full ghcr.io image with sha256 digest
        required: true
        type: string
      release_id:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: formaku-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Deploy through host controller
        env:
          IMAGE: ${{ inputs.image }}
          RELEASE_ID: ${{ inputs.release_id }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ vars.DEPLOY_HOST }}
          USER: ${{ vars.DEPLOY_USER }}
          FORMAKU_DEPLOYMENT_RECEIPT: ${{ runner.temp }}/formaku-deployment.json
        run: bash scripts/deploy-via-ssh.sh
      - name: Upload deployment receipt
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: formaku-deployment-${{ github.run_attempt }}
          path: ${{ runner.temp }}/formaku-deployment.json
          if-no-files-found: ignore
