name: Read runtime status
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Read runtime from the host controller
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ vars.DEPLOY_HOST }}
          USER: ${{ vars.DEPLOY_USER }}
          FORMAKU_RUNTIME_OBSERVATION: ${{ runner.temp }}/formaku-runtime.json
        run: bash scripts/deploy-via-ssh.sh --runtime-only
      - name: Upload runtime observation
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: formaku-runtime-${{ github.run_attempt }}
          path: ${{ runner.temp }}/formaku-runtime.json
          if-no-files-found: error
